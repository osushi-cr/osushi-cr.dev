<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お寿司 — AI Product Builder / PM / Engineer</title>
  <meta name="description" content="AITuber・ゲーム・小説をつくる、お寿司 (@osushi_cr) のデジタル名刺">
  <link rel="canonical" href="https://osushi-cr.dev/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍣</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    :root {
      --orange: #ff6b35;
      --orange-light: #fff3ed;
      --orange-glow: rgba(255, 107, 53, 0.15);
      --bg: #f8f6f3;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-sub: #888;
      --radius: 20px;
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 30%, var(--orange-glow) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 180, 130, 0.08) 0%, transparent 50%);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      padding: 24px;
      overflow-x: hidden;
    }

    /* Floating sushi */
    .floater {
      position: fixed;
      font-size: 24px;
      opacity: 0;
      animation: float 12s infinite ease-in-out;
      pointer-events: none;
      z-index: 0;
    }
    .floater:nth-child(1) { left: 8%; top: 15%; animation-delay: 0s; font-size: 20px; }
    .floater:nth-child(2) { left: 85%; top: 25%; animation-delay: 3s; font-size: 16px; }
    .floater:nth-child(3) { left: 12%; top: 75%; animation-delay: 6s; font-size: 22px; }
    .floater:nth-child(4) { left: 78%; top: 80%; animation-delay: 9s; font-size: 18px; }

    @keyframes float {
      0%, 100% { opacity: 0; transform: translateY(0) rotate(0deg); }
      20% { opacity: 0.3; }
      50% { opacity: 0.2; transform: translateY(-30px) rotate(10deg); }
      80% { opacity: 0.3; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 48px 40px 40px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.04),
        0 4px 16px rgba(0,0,0,0.04),
        0 12px 40px rgba(0,0,0,0.06);
      animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Avatar */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--orange);
      animation: sushiBounce 0.6s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes sushiBounce {
      from { opacity: 0; transform: scale(0) rotate(-20deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* Name */
    .name {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-weight: 900;
      font-size: 32px;
      color: var(--text);
      margin-top: 8px;
      animation: fadeUp 0.5s 0.4s ease both;
    }

    .handle {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 2px;
      font-weight: 500;
      animation: fadeUp 0.5s 0.5s ease both;
    }

    .role {
      margin-top: 14px;
      animation: fadeUp 0.5s 0.55s ease both;
    }

    .role-primary {
      color: var(--orange);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .role-secondary {
      margin-top: 4px;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .fields {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 13px;
      animation: fadeUp 0.5s 0.6s ease both;
    }

    .field {
      padding: 5px 9px;
      border: 1px solid rgba(255, 107, 53, .28);
      border-radius: 999px;
      background: var(--orange-light);
      color: var(--orange);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Divider */
    .divider {
      width: 40px;
      height: 3px;
      background: var(--orange);
      border-radius: 2px;
      margin: 20px auto 16px;
      animation: fadeUp 0.5s 0.65s ease both;
    }

    .section {
      text-align: left;
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 8px;
      animation: fadeUp 0.5s 0.7s ease both;
    }

    .works {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .work {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--orange-light);
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 11px 14px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      font-size: 14px;
      transition: all 0.25s ease;
      animation: fadeUp 0.5s ease both;
    }
    .works .work:nth-child(1) { animation-delay: 0.74s; }
    .works .work:nth-child(2) { animation-delay: 0.82s; }
    .works .work:nth-child(3) { animation-delay: 0.9s; }
    .works .work:nth-child(4) { animation-delay: 0.98s; }
    .works .work:nth-child(5) { animation-delay: 1.06s; }

    .work.featured {
      background: #fff;
      border-color: rgba(255, 107, 53, .35);
    }

    .work:hover {
      border-color: var(--orange);
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--orange-glow);
    }

    .work:active {
      transform: translateY(0);
    }

    .work-icon {
      width: 36px;
      height: 36px;
      background: var(--orange);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .work-icon svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .work-text {
      min-width: 0;
      text-align: left;
    }

    .work-name {
      font-weight: 700;
    }

    .work-label {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 400;
    }

    .follow-section {
      margin-top: 18px;
      animation: fadeUp 0.5s 1.14s ease both;
    }

    .follow-section .section-label {
      text-align: center;
    }

    .follow {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .follow-link {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #f3eee9;
      color: var(--text);
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .follow-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .follow-link:hover {
      background: var(--orange);
      color: #fff;
      transform: translateY(-2px);
    }

    /* QR */
    .qr-section {
      margin-top: 22px;
      animation: fadeUp 0.5s 1.22s ease both;
    }

    .qr-label {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    #qrcode {
      display: inline-block;
      padding: 10px;
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #f0ece8;
    }

    #qrcode canvas {
      display: block;
      border-radius: 6px;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #ccc;
      animation: fadeUp 0.5s 1.30s ease both;
    }

    @media (max-width: 420px) {
      .card { padding: 40px 28px 32px; }
      .name { font-size: 28px; }
      .sushi { font-size: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  <script src="/vendor/qrcode.min.js"></script>
  <script>
    const qr = qrcode(0, 'M');
    qr.addData('https://osushi-cr.dev/');
    qr.make();
    const size = 120;
    const modules = qr.getModuleCount();
    const cellSize = size / modules;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#1a1a1a';
    for (let row = 0; row < modules; row++) {
      for (let col = 0; col < modules; col++) {
        if (qr.isDark(row, col)) {
          ctx.beginPath();
          ctx.roundRect(col * cellSize, row * cellSize, cellSize, cellSize, cellSize * 0.25);
          ctx.fill();
        }
      }
    }
    document.getElementById('qrcode').appendChild(canvas);
  </script>
